name: codec_music
description: Codec Music - Streaming musik minimalis bertema Blue & White.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Audio
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Icons & fonts
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1

  # Utilities
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
